services: 
  #-----------------------------------------------
  #1. Database & Feature Store
  #-----------------------------------------------
  postgres: 
    image: postgres:15-alpine 
    container_name: postgres_db
    environment: 
      POSTGRES_USER: ml_user 
      POSTGRES_PASSWORD: ml_password
      POSTGRES_DB: feature_store
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  #-----------------------------------------------
  #2. Event Broker (Kafka)
  #-----------------------------------------------
  kafka: 
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
  #-----------------------------------------------
  #3. Transaction Producer (Local)
  #-----------------------------------------------
  producer: 
    build: 
      context: ./producer
    container_name: transaction_producer 
    depends_on:
      - kafka
    environment:
      - KAFKA_SERVER=kafka:29092
  #-----------------------------------------------
  #4. Stream Processor (Local)
  #-----------------------------------------------
  spark-processor: 
    build:
      context: ./spark 
    container_name: spark_processor 
    depends_on:
      - kafka 
      - postgres
    environment:
      - KAFKA_SERVER=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=feature_store
      - POSTGRES_USER=ml_user
      - POSTGRES_PASSWORD=ml_password
  #-----------------------------------------------
  #5. API (Local)
  #-----------------------------------------------
  model-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: model_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=feature_store
      - POSTGRES_USER=ml_user
      - POSTGRES_PASSWORD=ml_password
  #-----------------------------------------------
  #6. Monitoring
  #-----------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:














